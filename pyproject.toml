[project]
name = "hackowatt"
version = "0.1.0"
description = "Lokalny dashboard demonstracyjnego zużycia energii"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "numpy>=2.3",
    "pandas>=2.3",
    "plotly>=6.0",
    "scikit-learn>=1.7",
    "xgboost>=3.0",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 100
exclude = ["Project_openspec", ".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
